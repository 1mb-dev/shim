# goreleaser config for shim (schema v2). Mirrors `make build-all`:
# CGO off, -trimpath, -s -w, across darwin/linux × amd64/arm64.
#
# Publishing (GitHub release, GHCR images, Homebrew tap) fires ONLY from the
# release job on a version tag (.github/workflows/release.yml) — gated on the
# repo going public. `goreleaser release --snapshot` builds everything locally
# WITHOUT publishing, which is how this config is validated pre-public.
version: 2

project_name: shim

builds:
  - id: shim
    main: ./cmd/shim
    binary: shim
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: shim
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Multi-arch FROM-scratch image (dockers_v2 builds + manifests natively). Needs
# docker buildx + QEMU — present in CI (setup-buildx/qemu actions). SBOM off to
# keep the pipeline dependency-light (no syft); revisit as a supply-chain add.
dockers_v2:
  - id: shim
    ids: [shim]
    dockerfile: Dockerfile
    images:
      - ghcr.io/1mb-dev/shim
    tags:
      - "{{ .Version }}"
      # latest moves only on real releases — a prerelease (-rc/-beta) tag
      # publishes its own version tag but must not poison :latest.
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: "false"
    labels:
      org.opencontainers.image.source: "https://github.com/1mb-dev/shim"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: MIT

# Homebrew: shim is a build-from-source FORMULA hand-maintained in
# 1mb-dev/homebrew-tap (Formula/shim.rb), matching that tap's other formulae.
# It is NOT generated here — on a new release, bump the formula's `url` tag and
# `sha256` (of the github source archive) in the tap. `brew install
# 1mb-dev/tap/shim` resolves there.

release:
  github:
    owner: 1mb-dev
    name: shim
  # Created as a draft: a human publishes it after a final look (extra gate on
  # top of "only runs on a tag").
  draft: true
  # Flag -rc/-beta/-alpha SemVer tags as prereleases (pairs with the :latest
  # guard in dockers_v2 above).
  prerelease: auto
