# golangci-lint config (v1 schema).
# Stage 0: stdlib-leaning project; standard linters + a few correctness-focused extras.

run:
  timeout: 3m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
