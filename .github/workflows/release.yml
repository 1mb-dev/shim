name: release

# Tag pushes only; CI (ci.yml) covers PRs and main. Publishing needs a `v*` tag AND repo
# variable PUBLISH_ENABLED == 'true'. goreleaser creates the release as a draft.

on:
  push:
    tags: ['v*']

# Never cancel a publish mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # Write perm scoped to this job only (publishing the GitHub release).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          # Build with the latest patch of the current Go major (not the go.mod floor) so
          # published artifacts + the govulncheck gate get current stdlib security patches.
          # A pinned major moves by a commit, not by a Go release.
          go-version: '1.27'
          check-latest: true
      - run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
