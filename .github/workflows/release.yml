name: release

# Two jobs:
#   validate  — every PR + branch push: test, lint, and a goreleaser DRY RUN
#               (`release --snapshot`, builds everything, publishes nothing).
#   release   — version tag AND the PUBLISH_ENABLED gate: build the archives and
#               publish a GitHub release.
#
# Publish is INERT until the public flip. The release job is double-gated: it
# needs a `v*` tag AND repo variable PUBLISH_ENABLED == 'true'. Enabling publish
# is a deliberate act at go-public: (1) flip the repo public, (2) set the
# PUBLISH_ENABLED repo variable to 'true'. The Homebrew formula is a source build
# hand-maintained in 1mb-dev/homebrew-tap — no cross-repo token in CI. Until the
# gate is set a stray tag is a no-op — the release job skips.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Serialize per ref: a newer push to a branch cancels the older in-flight run
# (avoids overlapping validates racing on the buildx/binfmt cache). Tag/release
# runs are NEVER cancelled — don't kill a publish mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least privilege by default — read-only for every job (enough for checkout +
# tests). The release job widens to write only where it needs to publish.
permissions:
  contents: read

jobs:
  validate:
    # Everything except a tag push: prove tests/lint/build are green and the
    # release config produces artifacts — without publishing. Inherits the
    # read-only permissions above (no write perms for PRs, incl. forks).
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          # Build with latest-stable Go (not the go.mod floor) so published
          # artifacts + the govulncheck gate get current stdlib security patches.
          go-version: stable
          check-latest: true
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2 # match the local toolchain; v9 supports the v2 config
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      # gitleaks is the hard gate (the go-public secret-history precondition).
      # Module path is still github.com/zricethezav/gitleaks (the repo moved, the
      # module didn't), so go install must use that path.
      - name: gitleaks (full-history secret scan)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git . --log-opts="--all" --redact --no-banner
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

  release:
    # GATED: tag AND PUBLISH_ENABLED. Dormant until the public flip.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # Write perm scoped to this job only (publishing the GitHub release).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          # Build with latest-stable Go (not the go.mod floor) so published
          # artifacts + the govulncheck gate get current stdlib security patches.
          go-version: stable
          check-latest: true
      - run: go test -race ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
